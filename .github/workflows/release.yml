name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

env:
  GO_VERSION: '1.22'
  PYTHON_VERSION: '3.11'

jobs:
  # ── gate: tests must pass before anything ships ────────────────────────────

  test-go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go.sum
      - run: cd services && go test ./...

  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[sdk,dev]"
      - run: pytest tests/python/ -v

  # ── Go binary matrix ────────────────────────────────────────────────────────
  #
  # Builds all 6 binaries for each OS/arch pair in a single job.
  # Artifact per matrix cell: cogent-<tag>-<goos>-<goarch>.tar.gz

  build-go:
    name: Build Go — ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test-go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go.sum

      - name: Build all binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir -p dist/build

          for bin in consumer-greptime consumer-doris consumer-judge consumer-alerting server eval; do
            cd services
            go build -o ../dist/build/${bin}${EXT} ./cmd/${bin}
            cd ..
          done

          ARCHIVE="cogent-${VERSION}-${GOOS}-${GOARCH}.tar.gz"
          tar -czf "${ARCHIVE}" -C dist/build .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

  # ── Python: build wheel + sdist, publish to PyPI ───────────────────────────
  #
  # Requires secret PYPI_API_TOKEN in repo settings → Actions secrets.
  # Set environment: pypi in repo settings to scope the secret.

  publish-python:
    name: Publish to PyPI
    needs: test-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build
        run: |
          pip install build twine
          python -m build

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --verbose dist/*

  # ── GitHub Release: collect all Go tarballs, attach to release ─────────────

  create-release:
    name: Create GitHub Release
    needs: [build-go, publish-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: go-*
          merge-multiple: true
          path: dist/

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.tar.gz
